character_states:
  - id: "closeness"
    name: "亲疏"
    ranges:
      - min: 0
        max: 40
        content: "言语客气而带试探，不轻易让玩家接近自己的心事与脆弱。"
      - min: 41
        max: 70
        content: "会以含蓄玩笑或诗句回应玩家，也会留意玩家是否真正理解言外之意。"
      - min: 71
        max: 100
        content: "愿意显露真实忧思并接受陪伴，但敏感并不会因亲近而消失。"
