<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">大观园最小交互地图</title>
  <desc id="map-desc">怡红院、潇湘馆、蘅芜苑和秋爽斋四个可点击地点。</desc>
  <defs>
    <linearGradient id="garden-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f342f"/>
      <stop offset="1" stop-color="#273447"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="28" fill="url(#garden-bg)"/>
  <path d="M170 168 C340 90 620 92 790 168 M170 392 C350 470 620 470 790 392 M280 160 C210 260 214 330 280 400 M680 160 C750 260 746 330 680 400" fill="none" stroke="#8fa897" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12" opacity=".7"/>

  <g data-region-id="yihong-courtyard" tabindex="0" role="button" aria-label="怡红院">
    <rect x="92" y="88" width="250" height="128" rx="24" fill="#744d4d" stroke="#e0bbb0" stroke-width="4"/>
    <text x="217" y="158" fill="#fff5ed" font-size="30" text-anchor="middle">怡红院</text>
    <text x="217" y="190" fill="#ead6cc" font-size="18" text-anchor="middle">贾宝玉</text>
  </g>

  <g data-region-id="xiaoxiang-house" tabindex="0" role="button" aria-label="潇湘馆">
    <rect x="618" y="88" width="250" height="128" rx="24" fill="#355e50" stroke="#b9d9c6" stroke-width="4"/>
    <text x="743" y="158" fill="#effff6" font-size="30" text-anchor="middle">潇湘馆</text>
    <text x="743" y="190" fill="#d4e9dc" font-size="18" text-anchor="middle">林黛玉</text>
  </g>

  <g data-region-id="hengwu-garden" tabindex="0" role="button" aria-label="蘅芜苑">
    <rect x="92" y="344" width="250" height="128" rx="24" fill="#665d3f" stroke="#e2d5a6" stroke-width="4"/>
    <text x="217" y="414" fill="#fffbed" font-size="30" text-anchor="middle">蘅芜苑</text>
    <text x="217" y="446" fill="#e9e0bd" font-size="18" text-anchor="middle">薛宝钗</text>
  </g>

  <g data-region-id="qiushuang-study" tabindex="0" role="button" aria-label="秋爽斋">
    <rect x="618" y="344" width="250" height="128" rx="24" fill="#4d5576" stroke="#c7ceef" stroke-width="4"/>
    <text x="743" y="414" fill="#f5f6ff" font-size="30" text-anchor="middle">秋爽斋</text>
    <text x="743" y="446" fill="#d9ddf3" font-size="18" text-anchor="middle">贾探春</text>
  </g>

  <circle cx="480" cy="280" r="58" fill="#31483e" stroke="#afc8b7" stroke-width="4"/>
  <text x="480" y="288" fill="#edf7f0" font-size="24" text-anchor="middle">大观园</text>
</svg>
