<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">交互地图模板</title>
  <desc id="map-desc">把带有 data-region-id 的图形替换为本作品地图区域。</desc>
  <rect width="800" height="450" rx="24" fill="#1b2028"/>
  <path d="M90 90h620v270H90z" fill="#2a3442" stroke="#71829a" stroke-width="3" stroke-dasharray="10 8"/>
  <g data-region-id="start" tabindex="0" role="button" aria-label="起始地点">
    <circle cx="400" cy="225" r="72" fill="#526985" stroke="#b8cbe2" stroke-width="4"/>
    <text x="400" y="232" fill="#f3f6fa" font-size="25" text-anchor="middle">{起始地点}</text>
  </g>
</svg>
