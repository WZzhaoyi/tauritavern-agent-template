name: Sync template

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check for template updates without creating a pull request
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'WZzhaoyi/tauritavern-agent-template'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync framework updates
        uses: AndreasAugustin/actions-template-sync@6e1d0089686f8940604fc15baae62367bf6ee860 # v2.6.0
        with:
          source_repo_path: WZzhaoyi/tauritavern-agent-template
          upstream_branch: main
          pr_title: 'chore(template): sync upstream updates'
          pr_body: 'Sync framework-owned files from WZzhaoyi/tauritavern-agent-template. Review the CI result before merging.'
          pr_commit_msg: 'chore(template): sync upstream updates'
          pr_labels: template-sync
          template_sync_ignore_file_path: .github/.templatesyncignore
          is_force_deletion: false
          is_dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
